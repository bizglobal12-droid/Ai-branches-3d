<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Branches - 3D Interactive Ecosystem</title>
    <!-- Tailwind CSS for UI Overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for mouse interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030712; font-family: system-ui, sans-serif; }
        .label {
            position: absolute;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="text-white">

    <!-- Header Overlay -->
    <div class="absolute top-6 left-6 z-10 pointer-events-none">
        <h1 class="text-2xl font-bold tracking-wider text-amber-400">ARTIFICIAL INTELLIGENCE</h1>
        <p class="text-xs text-gray-400 tracking-widest uppercase">3D Ecosystem & Core Branches</p>
    </div>

    <!-- Instructions Overlay -->
    <div class="absolute bottom-6 left-6 z-10 pointer-events-none bg-gray-900/80 border border-gray-800 p-3 rounded-lg backdrop-blur text-xs text-gray-300">
        <p>🖱️ **Drag** to rotate | ⚙️ **Scroll** to zoom | 🌟 **Interactive 3D Nodes**</p>
    </div>

    <!-- Label Container -->
    <div id="label-container"></div>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xd4af37, 2, 50);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // --- 3. DATA & NODES ---
        const branches = [
            { name: "Machine Learning", color: 0x3b82f6, desc: "Data-driven pattern recognition & algorithms" },
            { name: "Deep Learning", color: 0x8b5cf6, desc: "Multi-layered artificial neural networks" },
            { name: "Natural Language Processing", color: 0x10b981, desc: "Human-computer linguistic interaction" },
            { name: "Computer Vision", color: 0xf59e0b, desc: "Visual data interpretation & processing" },
            { name: "Robotics", color: 0xef4444, desc: "Autonomous physical hardware control" },
            { name: "Expert Systems", color: 0x06b6d4, desc: "Rule-based decision-making models" },
            { name: "Fuzzy Logic", color: 0xec4899, desc: "Reasoning with degrees of truth" },
            { name: "Generative AI", color: 0x6366f1, desc: "Creative synthesis of text, image & code" }
        ];

        // Central AI Core Node
        const coreGeometry = new THREE.SphereGeometry(1.8, 32, 32);
        const coreMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xd4af37, 
            emissive: 0xd4af37, 
            emissiveIntensity: 0.5,
            roughness: 0.2,
            metalness: 0.8
        });
        const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(coreMesh);

        const labelContainer = document.getElementById('label-container');
        const nodeObjects = [];

        const radius = 9;
        const totalNodes = branches.length;

        branches.forEach((branch, index) => {
            const angle = (index / totalNodes) * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = (Math.sin(index * 2) * 1.5); // Slight vertical offset for 3D depth

            // Branch Node Sphere
            const nodeGeo = new THREE.SphereGeometry(0.7, 24, 24);
            const nodeMat = new THREE.MeshStandardMaterial({ 
                color: branch.color, 
                emissive: branch.color, 
                emissiveIntensity: 0.4,
                roughness: 0.3
            });
            const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
            nodeMesh.position.set(x, y, z);
            scene.add(nodeMesh);
            nodeObjects.push({ mesh: nodeMesh, name: branch.name });

            // Connecting Laser Line to Core
            const lineMat = new THREE.LineBasicMaterial({ color: branch.color, transparent: true, opacity: 0.4 });
            const points = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(x, y, z)];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeo, lineMat);
            scene.add(line);

            // Create HTML Label
            const div = document.createElement('div');
            div.className = 'label';
            div.innerHTML = `✨ ${branch.name}`;
            labelContainer.appendChild(div);
            branch.element = div;
        });

        // --- 4. ANIMATION & RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotate core slightly
            coreMesh.rotation.y = elapsedTime * 0.5;

            // Update 2D label positions based on 3D coordinates
            branches.forEach((branch, index) => {
                const vector = nodeObjects[index].mesh.position.clone();
                vector.project(camera);

                const x = (vector.x * .5 + .5) * window.innerWidth;
                const y = (-(vector.y * .5) + .5) * window.innerHeight;

                // Hide label if behind camera
                if (vector.z < 1) {
                    branch.element.style.transform = `translate(${x}px, ${y}px)`;
                    branch.element.style.display = 'block';
                } else {
                    branch.element.style.display = 'none';
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- 5. RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
